# Checks every pull request to main must pass before it can merge (see the main ruleset).
# Mirrors the Constitution's pre-commit ritual (memory lint, privacy, build) plus the design
# system and content rules. Actions are pinned to commit SHAs; Dependabot keeps them current.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Repository memory (OKF gate)
        run: |
          pip install -r requirements.txt
          python scripts/memory.py lint

      - name: Content rules (em dashes, frontmatter, line endings)
        if: github.event_name == 'pull_request'
        run: node scripts/check-content.mjs origin/${{ github.base_ref }}

      - name: Design system rules
        run: yarn ds:check

      - name: Lint
        run: npx eslint app components layouts scripts .storybook tests

      - name: Build (type-check, Contentlayer, Next.js)
        run: yarn build

  design-system:
    name: design-system
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build Storybook
        run: yarn build-storybook --quiet

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Screenshot baselines are rendered on Windows, so CI checks console errors and
      # horizontal overflow for every story, theme and width, but skips pixel comparison.
      - name: Story checks (light, dark, desktop, phone)
        run: yarn test:visual
        env:
          SKIP_SCREENSHOTS: '1'
